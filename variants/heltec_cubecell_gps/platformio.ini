; Heltec CubeCell GPS-6502 (HTCC-AB02S) — ASR6502 + SX1262 + onboard GPS (no BLE/WiFi)

[Heltec_CubeCell_GPS]
extends = cubecell_base
board = cubecell_gps
board_upload.maximum_size = 100352
build_flags = ${cubecell_base.build_flags}
  -UENV_INCLUDE_GPS
  -I variants/heltec_cubecell_gps
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=RGB
  -D PIN_USER_BTN=USER_KEY
build_src_filter = ${cubecell_base.build_src_filter}
  +<../variants/heltec_cubecell_gps>
lib_deps = ${cubecell_base.lib_deps}

[env:Heltec_CubeCell_GPS_repeater]
extends = Heltec_CubeCell_GPS
build_flags = ${Heltec_CubeCell_GPS.build_flags}
  -D ADVERT_NAME='"CubeCell Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=2
  -D MAX_CLIENTS=2
build_src_filter = ${Heltec_CubeCell_GPS.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  -<helpers/sensors/EnvironmentSensorManager.cpp>

[env:Heltec_CubeCell_GPS_room_server]
extends = Heltec_CubeCell_GPS
build_flags = ${Heltec_CubeCell_GPS.build_flags}
  -D ADVERT_NAME='"CubeCell Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D MAX_NEIGHBOURS=16
  -D MAX_CLIENTS=16
build_src_filter = ${Heltec_CubeCell_GPS.build_src_filter}
  +<../examples/simple_room_server/*.cpp>

[env:Heltec_CubeCell_GPS_sensor]
extends = Heltec_CubeCell_GPS
build_flags = ${Heltec_CubeCell_GPS.build_flags}
  -D ADVERT_NAME='"CubeCell Sensor"'
  -D ADMIN_PASSWORD='"password"'
build_src_filter = ${Heltec_CubeCell_GPS.build_src_filter}
  +<../examples/simple_sensor>

[env:Heltec_CubeCell_GPS_companion_radio_usb]
extends = Heltec_CubeCell_GPS
build_flags = ${Heltec_CubeCell_GPS.build_flags}
  -D MAX_CONTACTS=32
  -D MAX_GROUP_CHANNELS=4
  -D DISPLAY_CLASS=NullDisplayDriver
build_src_filter = ${Heltec_CubeCell_GPS.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/ui/NullDisplayDriver.cpp>
lib_deps =
  ${Heltec_CubeCell_GPS.lib_deps}
  densaugeo/base64 @ ~1.4.0
